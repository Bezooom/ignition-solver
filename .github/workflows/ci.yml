name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    name: solver self-checks (ИТОГ: ALL PASS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: pip install "numpy>=2"
      - name: Run solver with built-in acceptance checks
        run: python3 stiff_thermal_solver.py
